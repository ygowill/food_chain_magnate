name: CI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  # Keep these in sync with `project.godot` (config/features) when upgrading Godot.
  GODOT_VERSION: "4.5.1"
  GODOT_TAG: "4.5.1-stable"

jobs:
  guard-main-tag:
    name: Guard (tag must be on main)
    runs-on: ubuntu-latest
    outputs:
      on_main: ${{ steps.check.outputs.on_main }}
      tag_name: ${{ steps.check.outputs.tag_name }}
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check tag commit is on main
        id: check
        shell: bash
        run: |
          set -euo pipefail

          tag_name="${GITHUB_REF#refs/tags/}"
          echo "tag_name=${tag_name}" >> "$GITHUB_OUTPUT"

          if ! git show-ref --verify --quiet refs/remotes/origin/main; then
            echo "on_main=false" >> "$GITHUB_OUTPUT"
            echo "origin/main not found; skipping."
            exit 0
          fi

          if git merge-base --is-ancestor "${GITHUB_SHA}" refs/remotes/origin/main; then
            echo "on_main=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "on_main=false" >> "$GITHUB_OUTPUT"
          echo "Tag commit ${GITHUB_SHA} is not contained in origin/main; skipping."

  test:
    name: Tests (headless)
    runs-on: ubuntu-latest
    needs: guard-main-tag
    if: needs.guard-main-tag.outputs.on_main == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Godot
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/godot
            ~/.local/share/godot/export_templates
          key: ${{ runner.os }}-godot-${{ env.GODOT_TAG }}

      - name: Install Godot (editor) + export templates
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update -y
          sudo apt-get install -y unzip zip

          mkdir -p "$HOME/.cache/godot/bin"
          if [[ ! -f "$HOME/.cache/godot/bin/godot" ]]; then
            curl -sSL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_linux.x86_64.zip"
            rm -rf /tmp/godot_unzip
            mkdir -p /tmp/godot_unzip
            unzip -q /tmp/godot.zip -d /tmp/godot_unzip
            mv "/tmp/godot_unzip/Godot_v${GODOT_TAG}_linux.x86_64" "$HOME/.cache/godot/bin/godot"
            chmod +x "$HOME/.cache/godot/bin/godot"
          fi

          echo "$HOME/.cache/godot/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cache/godot/bin:$PATH"

          template_dir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          if [[ ! -d "$template_dir" ]] || [[ -z "$(ls -A "$template_dir" 2>/dev/null || true)" ]]; then
            curl -sSL -o /tmp/templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_export_templates.tpz"
            rm -rf /tmp/godot_templates
            mkdir -p /tmp/godot_templates
            unzip -q /tmp/templates.tpz -d /tmp/godot_templates
            rm -rf "$template_dir"
            mkdir -p "$template_dir"
            mv /tmp/godot_templates/templates/* "$template_dir"
          fi

          godot --version

      - name: Run all headless tests
        shell: bash
        run: |
          tools/run_headless_test.sh res://ui/scenes/tests/all_tests.tscn AllTests 60

  build-client-windows:
    name: Build client (Windows .exe)
    runs-on: ubuntu-latest
    needs: [guard-main-tag, test]
    if: needs.guard-main-tag.outputs.on_main == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Godot
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/godot
            ~/.local/share/godot/export_templates
          key: ${{ runner.os }}-godot-${{ env.GODOT_TAG }}

      - name: Install Godot (editor) + export templates
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update -y
          sudo apt-get install -y unzip zip

          mkdir -p "$HOME/.cache/godot/bin"
          if [[ ! -f "$HOME/.cache/godot/bin/godot" ]]; then
            curl -sSL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_linux.x86_64.zip"
            rm -rf /tmp/godot_unzip
            mkdir -p /tmp/godot_unzip
            unzip -q /tmp/godot.zip -d /tmp/godot_unzip
            mv "/tmp/godot_unzip/Godot_v${GODOT_TAG}_linux.x86_64" "$HOME/.cache/godot/bin/godot"
            chmod +x "$HOME/.cache/godot/bin/godot"
          fi

          echo "$HOME/.cache/godot/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cache/godot/bin:$PATH"

          template_dir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          if [[ ! -d "$template_dir" ]] || [[ -z "$(ls -A "$template_dir" 2>/dev/null || true)" ]]; then
            curl -sSL -o /tmp/templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_export_templates.tpz"
            rm -rf /tmp/godot_templates
            mkdir -p /tmp/godot_templates
            unzip -q /tmp/templates.tpz -d /tmp/godot_templates
            rm -rf "$template_dir"
            mkdir -p "$template_dir"
            mv /tmp/godot_templates/templates/* "$template_dir"
          fi

          # Exports in this workflow run with HOME="$PWD/.tmp_home". Make export templates visible there.
          mkdir -p "$PWD/.tmp_home/.local/share/godot"
          ln -sfn "$HOME/.local/share/godot/export_templates" "$PWD/.tmp_home/.local/share/godot/export_templates"

          godot --version

      - name: Import project resources
        shell: bash
        run: |
          HOME="$PWD/.tmp_home" godot --headless --import --path "$PWD" >/dev/null 2>&1

      - name: Set build version (from tag)
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.guard-main-tag.outputs.tag_name }}"
          version="${tag#v}"
          tmp="$(mktemp)"
          awk -v ver="${version}" '
            BEGIN { in_app = 0; replaced = 0 }
            /^\[application\]$/ { in_app = 1; print; next }
            /^\[/ { in_app = 0 }
            {
              if (in_app && $0 ~ /^config\/version=/) {
                print "config/version=\"" ver "\""
                replaced = 1
                next
              }
              print
            }
            END { if (!replaced) exit 3 }
          ' project.godot > "$tmp"
          mv "$tmp" project.godot
          echo "Set project.godot config/version=${version}"

      - name: Export Windows build
        shell: bash
        run: |
          mkdir -p build/client/windows
          HOME="$PWD/.tmp_home" godot --headless --path "$PWD" --export-release "Windows Desktop" build/client/windows/FCM.exe

      - name: Package release assets
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.guard-main-tag.outputs.tag_name }}"

          mkdir -p build/release

          zip_name="FCM-windows-x86_64-${tag}.zip"
          (cd build/client/windows && zip -qr "../../release/${zip_name}" .)
          sha256sum "build/release/${zip_name}" > "build/release/${zip_name}.sha256"

      - name: Upload release assets artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-windows-${{ needs.guard-main-tag.outputs.tag_name }}
          path: build/release

  build-client-web:
    name: Build client (Web)
    runs-on: ubuntu-latest
    needs: [guard-main-tag, test]
    if: needs.guard-main-tag.outputs.on_main == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Godot
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/godot
            ~/.local/share/godot/export_templates
          key: ${{ runner.os }}-godot-${{ env.GODOT_TAG }}

      - name: Install Godot (editor) + export templates
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update -y
          sudo apt-get install -y unzip zip

          mkdir -p "$HOME/.cache/godot/bin"
          if [[ ! -f "$HOME/.cache/godot/bin/godot" ]]; then
            curl -sSL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_linux.x86_64.zip"
            rm -rf /tmp/godot_unzip
            mkdir -p /tmp/godot_unzip
            unzip -q /tmp/godot.zip -d /tmp/godot_unzip
            mv "/tmp/godot_unzip/Godot_v${GODOT_TAG}_linux.x86_64" "$HOME/.cache/godot/bin/godot"
            chmod +x "$HOME/.cache/godot/bin/godot"
          fi

          echo "$HOME/.cache/godot/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cache/godot/bin:$PATH"

          template_dir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          if [[ ! -d "$template_dir" ]] || [[ -z "$(ls -A "$template_dir" 2>/dev/null || true)" ]]; then
            curl -sSL -o /tmp/templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_export_templates.tpz"
            rm -rf /tmp/godot_templates
            mkdir -p /tmp/godot_templates
            unzip -q /tmp/templates.tpz -d /tmp/godot_templates
            rm -rf "$template_dir"
            mkdir -p "$template_dir"
            mv /tmp/godot_templates/templates/* "$template_dir"
          fi

          # Exports in this workflow run with HOME="$PWD/.tmp_home". Make export templates visible there.
          mkdir -p "$PWD/.tmp_home/.local/share/godot"
          ln -sfn "$HOME/.local/share/godot/export_templates" "$PWD/.tmp_home/.local/share/godot/export_templates"

          godot --version

      - name: Import project resources
        shell: bash
        run: |
          HOME="$PWD/.tmp_home" godot --headless --import --path "$PWD" >/dev/null 2>&1

      - name: Export Web build
        shell: bash
        run: |
          tag="${{ needs.guard-main-tag.outputs.tag_name }}"
          version="${tag#v}"
          tools/export_web.sh --version "${version}"

      - name: Upload Web export artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-export-${{ needs.guard-main-tag.outputs.tag_name }}
          path: build/client/web

      - name: Package release assets
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.guard-main-tag.outputs.tag_name }}"

          mkdir -p build/release

          zip_name="FCM-web-${tag}.zip"
          (cd build/client/web && zip -qr "../../release/${zip_name}" .)
          sha256sum "build/release/${zip_name}" > "build/release/${zip_name}.sha256"

      - name: Upload release assets artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-web-${{ needs.guard-main-tag.outputs.tag_name }}
          path: build/release

  build-server-docker:
    name: Build server Docker image
    runs-on: ubuntu-latest
    needs: [guard-main-tag, test]
    if: needs.guard-main-tag.outputs.on_main == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set build version (from tag)
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          version="${tag#v}"
          tmp="$(mktemp)"
          awk -v ver="${version}" '
            BEGIN { in_app = 0; replaced = 0 }
            /^\[application\]$/ { in_app = 1; print; next }
            /^\[/ { in_app = 0 }
            {
              if (in_app && $0 ~ /^config\/version=/) {
                print "config/version=\"" ver "\""
                replaced = 1
                next
              }
              print
            }
            END { if (!replaced) exit 3 }
          ' project.godot > "$tmp"
          mv "$tmp" project.godot
          echo "Set project.godot config/version=${version}"

      - name: Set image name
        shell: bash
        run: |
          set -euo pipefail
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}/fcm-server" >> "$GITHUB_ENV"

      - name: Docker meta
        shell: bash
        run: |
          set -euo pipefail
          tag_name="${GITHUB_REF#refs/tags/}"
          tags=(
            "${IMAGE_NAME}:${GITHUB_SHA}"
            "${IMAGE_NAME}:${tag_name}"
          )
          if [[ "${tag_name}" != *"-"* ]]; then
            tags+=("${IMAGE_NAME}:latest")
          fi
          {
            echo "IMAGE_TAGS<<EOF"
            printf "%s\n" "${tags[@]}"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          build-args: |
            GODOT_TAG=${{ env.GODOT_TAG }}
          push: true
          tags: ${{ env.IMAGE_TAGS }}

  build-backend-docker:
    name: Build backend Docker image
    runs-on: ubuntu-latest
    needs: [guard-main-tag, test]
    if: needs.guard-main-tag.outputs.on_main == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image name
        shell: bash
        run: |
          set -euo pipefail
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}/fcm-backend" >> "$GITHUB_ENV"

      - name: Docker meta
        shell: bash
        run: |
          set -euo pipefail
          tag_name="${GITHUB_REF#refs/tags/}"
          tags=(
            "${IMAGE_NAME}:${GITHUB_SHA}"
            "${IMAGE_NAME}:${tag_name}"
          )
          if [[ "${tag_name}" != *"-"* ]]; then
            tags+=("${IMAGE_NAME}:latest")
          fi
          {
            echo "IMAGE_TAGS<<EOF"
            printf "%s\n" "${tags[@]}"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: backend/Dockerfile
          push: true
          tags: ${{ env.IMAGE_TAGS }}

  build-web-docker:
    name: Build web Docker image
    runs-on: ubuntu-latest
    needs: [guard-main-tag, test, build-client-web]
    if: needs.guard-main-tag.outputs.on_main == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Web export
        uses: actions/download-artifact@v4
        with:
          name: web-export-${{ needs.guard-main-tag.outputs.tag_name }}
          path: build/client/web

      - name: Set image name
        shell: bash
        run: |
          set -euo pipefail
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}/fcm-web" >> "$GITHUB_ENV"

      - name: Docker meta
        shell: bash
        run: |
          set -euo pipefail
          tag_name="${GITHUB_REF#refs/tags/}"
          tags=(
            "${IMAGE_NAME}:${GITHUB_SHA}"
            "${IMAGE_NAME}:${tag_name}"
          )
          if [[ "${tag_name}" != *"-"* ]]; then
            tags+=("${IMAGE_NAME}:latest")
          fi
          {
            echo "IMAGE_TAGS<<EOF"
            printf "%s\n" "${tags[@]}"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          push: true
          tags: ${{ env.IMAGE_TAGS }}

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [guard-main-tag, test, build-client-windows, build-client-web, build-server-docker, build-backend-docker, build-web-docker]
    if: needs.guard-main-tag.outputs.on_main == 'true'
    permissions:
      contents: write
    steps:
      - name: Download release assets (Windows)
        uses: actions/download-artifact@v4
        with:
          name: release-assets-windows-${{ needs.guard-main-tag.outputs.tag_name }}
          path: build/release/windows

      - name: Download release assets (Web)
        uses: actions/download-artifact@v4
        with:
          name: release-assets-web-${{ needs.guard-main-tag.outputs.tag_name }}
          path: build/release/web

      - name: Delete existing release (if any)
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace(/^refs\/tags\//, "");
            core.info(`Tag: ${tag}`);

            try {
              const { data: release } = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              });
              core.info(`Deleting existing release id=${release.id} for tag=${tag}`);
              await github.rest.repos.deleteRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.id,
              });
            } catch (e) {
              if (e.status === 404) {
                core.info(`No existing release for tag=${tag}`);
              } else {
                throw e;
              }
            }

      - name: Generate release notes
        shell: bash
        run: |
          set -euo pipefail

          tag="${{ needs.guard-main-tag.outputs.tag_name }}"
          repo_lower="$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          server_image_base="ghcr.io/${repo_lower}/fcm-server"
          backend_image_base="ghcr.io/${repo_lower}/fcm-backend"
          web_image_base="ghcr.io/${repo_lower}/fcm-web"

          mkdir -p dist
          find build/release -type f -name '*.zip' -exec cp -f {} dist/ \;
          find build/release -type f -name '*.sha256' -exec cp -f {} dist/ \;

          {
            echo "# ${tag}"
            echo
            echo "## Downloads"
            for f in dist/*.zip; do
              echo "- $(basename "$f")"
            done
            for f in dist/*.sha256; do
              echo "- $(basename "$f")"
            done
            echo
            echo "## Docker"
            echo "- ${server_image_base}:${tag}"
            echo "- ${backend_image_base}:${tag}"
            echo "- ${web_image_base}:${tag}"
            if [[ "${tag}" != *"-"* ]]; then
              echo "- ${server_image_base}:latest"
              echo "- ${backend_image_base}:latest"
              echo "- ${web_image_base}:latest"
            fi
            echo
            echo "## Verified"
            echo "- Headless tests: AllTests"
          } > RELEASE.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ needs.guard-main-tag.outputs.tag_name }}
          tag_name: ${{ needs.guard-main-tag.outputs.tag_name }}
          prerelease: ${{ contains(needs.guard-main-tag.outputs.tag_name, '-') }}
          body_path: RELEASE.md
          files: |
            dist/*
          fail_on_unmatched_files: true
