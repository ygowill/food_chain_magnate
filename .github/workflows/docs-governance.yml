name: Docs Governance

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-governance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-governance:
    name: Metadata, links, and evidence
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify governance checker
        run: python3 tools/docs_governance.py --self-test

      - name: Check repository documentation
        run: python3 tools/docs_governance.py

      - name: Verify Skill governance checker
        run: python3 tools/skills_governance.py --self-test

      - name: Check repository Skills and Evals
        run: python3 tools/skills_governance.py
