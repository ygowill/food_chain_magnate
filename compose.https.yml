services:
  # HTTPS reverse proxy (Let's Encrypt via Cloudflare DNS-01)
  traefik:
    image: ${FCM_DOCKER_IO_PREFIX:-}traefik:v3.1
    container_name: fcm-traefik
    restart: unless-stopped
    command:
      - --log.level=INFO
      - --api.dashboard=false

      # File provider avoids Docker API compatibility issues on some hosts.
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --providers.file.watch=true

      - --entrypoints.web.address=:${FCM_HTTP_PORT:-80}
      - --entrypoints.websecure.address=:${FCM_HTTPS_PORT:-443}
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https

      - --certificatesresolvers.le.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.dnschallenge=true
      - --certificatesresolvers.le.acme.dnschallenge.provider=cloudflare
    environment:
      # Required (recommended token permissions: Zone.DNS:Edit for your zone).
      - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN}
    ports:
      - "${FCM_HTTP_PORT:-80}:${FCM_HTTP_PORT:-80}"
      - "${FCM_HTTPS_PORT:-443}:${FCM_HTTPS_PORT:-443}"
    volumes:
      - ${FCM_TRAEFIK_DYNAMIC_FILE:-./traefik_dynamic.yml}:/etc/traefik/dynamic.yml:ro
      - traefik_letsencrypt:/letsencrypt

  server:
    ports: []

  web:
    ports: []

volumes:
  traefik_letsencrypt:
