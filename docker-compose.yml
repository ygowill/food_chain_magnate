services:
  # HTTPS reverse proxy (Let's Encrypt via Cloudflare DNS-01)
  traefik:
    image: ${FCM_DOCKER_IO_PREFIX:-}traefik:v3.1
    container_name: fcm-traefik
    restart: unless-stopped
    command:
      - --log.level=INFO
      - --api.dashboard=false

      # File provider avoids Docker API compatibility issues on some hosts.
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --providers.file.watch=true

      - --entrypoints.web.address=:${FCM_HTTP_PORT:-80}
      - --entrypoints.websecure.address=:${FCM_HTTPS_PORT:-443}
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https

      - --certificatesresolvers.le.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.dnschallenge=true
      - --certificatesresolvers.le.acme.dnschallenge.provider=cloudflare
      - --certificatesresolvers.le.acme.keytype=${FCM_ACME_KEY_TYPE:-EC256}
    environment:
      # Required (recommended token permissions: Zone.DNS:Edit for your zone).
      - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN}
    ports:
      - "${FCM_HTTP_PORT:-80}:${FCM_HTTP_PORT:-80}"
      - "${FCM_HTTPS_PORT:-443}:${FCM_HTTPS_PORT:-443}"
    volumes:
      - ${FCM_TRAEFIK_DYNAMIC_FILE:-./traefik_dynamic.yml}:/etc/traefik/dynamic.yml:ro
      - traefik_letsencrypt:/letsencrypt

  db:
    image: postgres:16-alpine
    container_name: fcm-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: fcm
      POSTGRES_PASSWORD: fcm
      POSTGRES_DB: fcm
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    image: ${FCM_BACKEND_IMAGE:-ghcr.io/ygowill/food_chain_magnate/fcm-backend:${FCM_TAG:-latest}}
    container_name: fcm-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://fcm:fcm@db:5432/fcm
      HMAC_SECRET: change-me-in-production
      INTERNAL_API_SECRET: dev-internal-secret-change-in-production
      WEB_ORIGIN: "http://localhost:5173"
      DEFAULT_WS_URL: "${FCM_DEFAULT_WS_URL:-ws://localhost:7000}"
    depends_on:
      - db

  server:
    image: ${FCM_SERVER_IMAGE:-ghcr.io/ygowill/food_chain_magnate/fcm-server:${FCM_TAG:-latest}}
    container_name: fcm-server
    restart: unless-stopped
    environment:
      PORT: "7000"
      BIND: "0.0.0.0"
      PLATFORM_BACKEND_URL: "http://backend:8000"
      HMAC_SECRET: change-me-in-production
      INTERNAL_API_SECRET: dev-internal-secret-change-in-production
    depends_on:
      - backend

  web:
    image: ${FCM_WEB_IMAGE:-ghcr.io/ygowill/food_chain_magnate/fcm-web:${FCM_TAG:-latest}}
    container_name: fcm-web
    restart: unless-stopped
    depends_on:
      - backend

volumes:
  pgdata:
  traefik_letsencrypt:
