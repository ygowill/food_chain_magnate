services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fcm
      POSTGRES_PASSWORD: fcm
      POSTGRES_DB: fcm
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://fcm:fcm@db:5432/fcm
      HMAC_SECRET: change-me-in-production
      WEB_ORIGIN: "http://localhost:5173"
    depends_on:
      - db

volumes:
  pgdata:
