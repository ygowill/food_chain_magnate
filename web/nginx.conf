server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    charset utf-8;
    add_header X-Content-Type-Options nosniff always;

    # 常见部署方式是放在反代之后（Cloudflare/NPM/Traefik 等）。
    # 关闭绝对重定向，避免在非 443 端口部署时丢失外部的 scheme/port。
    absolute_redirect off;

    # API 反代到 backend 容器
    location /v1/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Godot HTML5 导出文件。
    # 开启 Web 线程支持时，Godot 需要浏览器处于 cross-origin isolated 环境，
    # 因此必须返回 COOP/COEP 头；同时继续禁用缓存，避免导出更新后命中旧资源。
    location /game/ {
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Vue 路由 `/game` 与 Godot 导出目录 `/game/` 冲突。
    # 如果不做精确匹配，nginx 会把 `/game` 当成目录并自动 301 到 `/game/`，
    # 在 Cloudflare/NPM 等反代 + 非 443 端口（例如 :8443）时，Location 往往会丢端口/协议。
    location = /game {
        try_files /index.html =404;
    }

    # WebAssembly MIME 类型
    location ~* \.wasm$ {
        default_type application/wasm;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Vue SPA — index.html 不缓存
    location = /index.html {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # 静态资源（Vite 构建产物带 hash，可长期缓存）
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # SPA fallback — 所有未匹配路径回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
