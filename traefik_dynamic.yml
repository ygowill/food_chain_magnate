http:
  routers:
    # WebSocket server (recommended: use a dedicated subdomain)
    fcm-ws:
      rule: Host(`ws.game.example.com`)
      entryPoints:
        - websecure
      tls:
        certResolver: le
      service: fcm-ws

    # WebSocket fallback on same host/path for clients that cannot resolve ws subdomain reliably.
    fcm-ws-path:
      rule: Host(`game.example.com`) && PathPrefix(`/ws`)
      entryPoints:
        - websecure
      priority: 100
      tls:
        certResolver: le
      service: fcm-ws

    # Web client
    fcm-web:
      rule: Host(`game.example.com`)
      entryPoints:
        - websecure
      tls:
        certResolver: le
      service: fcm-web

  services:
    fcm-ws:
      loadBalancer:
        servers:
          - url: http://server:7000
    fcm-web:
      loadBalancer:
        servers:
          - url: http://web:80
